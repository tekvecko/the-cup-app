<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">THE CUP</title>
  <desc id="description">Blue tournament cup emblem on a dark circular field.</desc>
  <defs>
