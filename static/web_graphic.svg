<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title description">
  <title id="title">THE CUP tournament graphic</title>
  <desc id="description">Dark blue championship banner with a glowing cup emblem and geometric arena lines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#071d49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#1d4ed8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="700" fill="url(#background)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>
  <ellipse cx="800" cy="330" rx="560" ry="390" fill="url(#halo)"/>
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.18">
    <path d="M-80 592L420 150h280L190 650M1680 592L1180 150H900l510 500" stroke-width="4"/>
    <path d="M0 626h1600M110 664h1380" stroke-width="2"/>
  </g>
  <g transform="translate(800 304)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-112-170h224v72c0 88-46 142-112 142S-112-10-112-98z" stroke-width="21"/>
    <path d="M-112-132h-62v31c0 58 41 96 97 101M112-132h62v31c0 58-41 96-97 101" stroke-width="18"/>
    <path d="M0 44v61M-57 128H57M-39 105h78" stroke-width="20"/>
  </g>
  <path d="M760 205h80l-24 24 9 39-25-16-25 16 9-39z" fill="#f8fafc" opacity="0.95"/>
  <text x="800" y="520" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="84" font-style="italic" font-weight="900" letter-spacing="6" text-anchor="middle">THE CUP</text>
  <text x="800" y="572" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="11" text-anchor="middle">TOURNAMENT PLATFORM</text>
  <rect x="654" y="604" width="292" height="6" rx="3" fill="url(#accent)"/>
</svg>
