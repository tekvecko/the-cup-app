<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vytvořit Turnaj - The Cup</title>
    <style>
        :root {
            --bg-main: #0B0E14;
            --bg-card: #151A27;
            --bg-input: #1F2639;
            --text-main: #FFFFFF;
            --text-muted: #8E9EBB;
            --accent-blue: #2D68FF;
            --accent-blue-hover: #1E4ED8;
            --border-radius: 12px;
        }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 20px;
        }
        .logo {
            display: inline-block;
            border: 1px solid #1F2639;
            border-radius: 20px;
            padding: 8px 24px;
            color: #2D68FF;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
        }
        h1 {
            text-align: center;
            color: #2D68FF;
            font-style: italic;
            text-transform: uppercase;
            margin: 10px 0 30px;
            font-size: 24px;
        }
        .container {
            flex: 1;
            padding: 0 16px;
            padding-bottom: 80px;
        }
        .card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 16px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            background-color: var(--bg-input);
            border: none;
            border-radius: 8px;
            padding: 14px;
            color: white;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            appearance: none;
        }
        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238E9EBB%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 12px auto;
        }
        
        /* AI Banner Sekce */
        .ai-banner-container {
            background: linear-gradient(145deg, #1A2235, #111622);
            border: 1px dashed #2D68FF;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .ai-banner-preview {
            width: 100%;
            height: 120px;
            background-color: var(--bg-input);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }
        .ai-banner-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .ai-banner-text {
            color: var(--text-muted);
            font-size: 14px;
        }
        .btn-ai {
            background: linear-gradient(90deg, #6b21a8, #2D68FF);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn-ai:active {
            opacity: 0.8;
        }
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            width: 100%;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        /* Spodní navigace */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-main);
            border-top: 1px solid #1F2639;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            padding-bottom: env(safe-area-inset-bottom, 10px);
            z-index: 10;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 10px;
            gap: 4px;
        }
        .nav-item.active {
            color: var(--accent-blue);
        }
        .nav-fab {
            background-color: var(--accent-blue);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-top: -24px;
            box-shadow: 0 4px 10px rgba(45, 104, 255, 0.4);
        }
        svg { fill: currentColor; width: 24px; height: 24px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">THE CUP</div>
    </header>
    
    <h1>Vytvořit Turnaj</h1>

    <div class="container">
        <div class="card">
            <div class="form-group">
                <label>Název turnaje</label>
                <input type="text" id="tournamentName" value="Point 2026">
            </div>

            <div class="form-group">
                <label>Vizuál Turnaje (AI Banner)</label>
                <div class="ai-banner-container">
                    <div class="ai-banner-preview" id="bannerPreview">
                        <span class="ai-banner-text" id="bannerPlaceholder">Zatím bez banneru</span>
                        <img id="bannerImage" src="" alt="Vygenerovaný AI Banner">
                    </div>
                    <button type="button" class="btn-ai" onclick="generateAIBanner()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span id="aiBtnText">Vygenerovat přes AI</span>
                        <div class="loader" id="aiLoader"></div>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Kapacita</label>
                    <input type="number" value="8">
                </div>
                <div class="form-group">
                    <label>Datum konání</label>
                    <input type="date" value="2026-05-17">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Formát pavouka</label>
                    <select>
                        <option>Skupiny + Playof</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Skupiny</label>
                    <select>
                        <option>1 velká skupina</option>
                    </select>
                </div>
            </div>

            <button class="btn-primary">Generovat turnajový uzel</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>DOMŮ</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>TÝMY</span>
        </div>
        <div class="nav-fab">+</div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
            <span>TURNAJE</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            <span>SLÁVA</span>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>ÚČET</span>
        </div>
    </div>

    <script>
        function generateAIBanner() {
            const btnText = document.getElementById('aiBtnText');
            const loader = document.getElementById('aiLoader');
            const placeholder = document.getElementById('bannerPlaceholder');
            const img = document.getElementById('bannerImage');
            const tournamentName = document.getElementById('tournamentName').value || 'Turnaj';

            // Zobrazení loaderu (simulace čekání na AI API)
            btnText.style.display = 'none';
            loader.style.display = 'block';

            setTimeout(() => {
                // Skrytí loaderu
                btnText.style.display = 'inline';
                btnText.innerText = 'Vygenerovat jiný';
                loader.style.display = 'none';
                
                // Zobrazení výsledku
                placeholder.style.display = 'none';
                img.src = `https://placehold.co/600x200/2D68FF/FFFFFF?text=${encodeURIComponent(tournamentName)}+Banner`;
                img.style.display = 'block';
            }, 1800);
        }
    </script>
</body>
</html>
